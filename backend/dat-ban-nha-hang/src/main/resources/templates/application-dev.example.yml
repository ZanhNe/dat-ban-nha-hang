server:
    port: 8080
# --- KẾT NỐI DATABASE ---
spring:
    datasource:
        url: jdbc:mysql://localhost:3306/dat_ban_nha_hang?allowPublicKeyRetrieval=true&useSSL=false
        username: root
        password: ABC
        driver-class-name: com.mysql.cj.jdbc.Driver
    
    sql:
        init:
            mode: always
 
    
    jpa:
        hibernate:
            ddl-auto: create
        show-sql: false
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.MySQLDialect
        defer-datasource-initialization: true

goong:
    api-key: TEST
    url: https://rsapi.goong.io/v2/
    timeout: 5000

jwt:
    secret: ABC
    expiration: 86400000

vnpay:
    url: TEST # URL cổng thanh toán
    tmn-code: TEST     # vnp_TmnCode: Mã định danh website
    hash-secret: TEST  # vnp_HashSecret: Chuỗi bí mật để băm mã
    return-url: TEST # FE nhận kết quả
    version: "2.1.0"                   # vnp_Version
    command: "pay"                     # vnp_Command


ngrok: #Dùng để tunelling forward port từ server ngrok nối sang localhost cho Webhook IPN
    auth-token: TEST